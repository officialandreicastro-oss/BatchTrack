<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatchTrack - Smart Food Tech Inventory</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #10b981;
            --primary-hover: #059669;
            --danger: #ef4444;
            --warning: #f59e0b;
            --safe: #3b82f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }

        header h1 { margin: 0; font-size: 24px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        header p { margin: 5px 0 0 0; color: var(--text-muted); font-size: 14px; }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        @media (min-width: 768px) {
            .grid { grid-template-columns: 1fr 2fr; }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h2 { margin-top: 0; font-size: 18px; color: var(--text-main); margin-bottom: 20px; display: flex; justify-content: space-between; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-muted); font-weight: 500; }
        input, select {
            width: 100%;
            padding: 10px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            box-sizing: border-box;
            transition: border 0.2s;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary); }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }

        /* Table & Badge Styling */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { color: var(--text-muted); font-weight: 600; background: rgba(0,0,0,0.1); }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }
        .badge-warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid var(--warning); }
        .badge-safe { background: rgba(59, 130, 246, 0.15); color: var(--safe); border: 1px solid var(--safe); }

        .btn-action {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 6px 10px;
            width: auto;
            font-size: 12px;
        }
        .btn-action:hover { background: var(--danger); color: white; border-color: var(--danger); }

        .metrics-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .metric-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .metric-box div:first-child { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .metric-box div:last-child { font-size: 20px; font-weight: 700; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>📦 BatchTrack</h1>
            <p>Technopreneurship Dashboard: Food Logistics, Safety & FIFO Control</p>
        </div>
        <div style="text-align: right;">
            <span class="badge badge-safe" style="font-size: 13px;">System Operational</span>
        </div>
    </header>

    <div class="metrics-bar">
        <div class="metric-box">
            <div>Total Active Batches</div>
            <div id="m-total">0</div>
        </div>
        <div class="metric-box" style="border-left: 3px solid var(--warning);">
            <div>Expiring Soon (&lt; 3 Days)</div>
            <div id="m-warning" style="color: var(--warning);">0</div>
        </div>
        <div class="metric-box" style="border-left: 3px solid var(--danger);">
            <div>Critical / Expired</div>
            <div id="m-danger" style="color: var(--danger);">0</div>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Log New Stock Batch</h2>
            <div class="form-group">
                <label>Ingredient / Raw Material Name</label>
                <input type="text" id="batchName" placeholder="e.g., Chicken Skin, Fresh Corn">
            </div>
            <div class="form-group">
                <label>Batch Code / Lot ID</label>
                <input type="text" id="batchId" placeholder="e.g., BATCH-2026-A">
            </div>
            <div class="form-group">
                <label>Quantity Available</label>
                <input type="text" id="batchQty" placeholder="e.g., 15 kg, 50 pcs">
            </div>
            <div class="form-group">
                <label>Expiration Date</label>
                <input type="date" id="batchExp">
            </div>
            <button onclick="addBatch()">Log Batch to System</button>
        </div>

        <div class="card">
            <h2>FIFO Action Queue <span style="font-size: 12px; font-weight: normal; color: var(--text-muted);">Sorted by earliest expiry</span></h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Batch ID</th>
                            <th>Item Name</th>
                            <th>Stock Qty</th>
                            <th>Days Left</th>
                            <th>FIFO Priority</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="batchTableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // Mock baseline data for presentation simulation
    let inventory = [
        { id: "LOT-0512-A", name: "Raw Chicken Skin", qty: "20 kg", expDate: "2026-05-18" }, // Soon
        { id: "LOT-0510-B", name: "Sweet Corn Ears", qty: "100 pcs", expDate: "2026-05-25" }, // Safe
        { id: "LOT-0501-C", name: "Cooking Oil (Bulk)", qty: "5 L", expDate: "2026-05-14" }  // Expired
    ];

    // Auto-populate default form date helper to today
    document.getElementById('batchExp').valueAsDate = new Date();

    function renderInventory() {
        const tbody = document.getElementById('batchTableBody');
        tbody.innerHTML = '';

        // Food Tech Logic: Sort automatically by absolute lowest days left (FIFO Engine)
        inventory.sort((a, b) => new Date(a.expDate) - new Date(b.expDate));

        let total = inventory.length;
        let warningCount = 0;
        let dangerCount = 0;

        const today = new Date();
        today.setHours(0,0,0,0);

        inventory.forEach((item, index) => {
            const exp = new Date(item.expDate);
            exp.setHours(0,0,0,0);
            
            // Calculate real days remaining until expiration
            const timeDiff = exp.getTime() - today.getTime();
            const daysLeft = Math.ceil(timeDiff / (1000 * 3600 * 24));

            let statusBadge = '';
            if (daysLeft < 0) {
                statusBadge = `<span class="badge badge-danger">CRITICAL / EXPIRED</span>`;
                dangerCount++;
            } else if (daysLeft <= 3) {
                statusBadge = `<span class="badge badge-warning">USE NEXT (FIFO)</span>`;
                warningCount++;
            } else {
                statusBadge = `<span class="badge badge-safe">STABLE</span>`;
            }

            const daysText = daysLeft < 0 ? `Expired (${Math.abs(daysLeft)}d ago)` : `${daysLeft} days`;

            const row = `<tr>
                <td style="font-family: monospace; color: var(--primary);">${item.id}</td>
                <td><strong>${item.name}</strong></td>
                <td>${item.qty}</td>
                <td>${daysText}</td>
                <td>${statusBadge}</td>
                <td><button class="btn-action" onclick="useBatch(${index})">Dispense</button></td>
            </tr>`;
            tbody.innerHTML += row;
        });

        // Update dashboard metrics counter
        document.getElementById('m-total').innerText = total;
        document.getElementById('m-warning').innerText = warningCount;
        document.getElementById('m-danger').innerText = dangerCount;
    }

    function addBatch() {
        const name = document.getElementById('batchName').value.trim();
        const id = document.getElementById('batchId').value.trim();
        const qty = document.getElementById('batchQty').value.trim();
        const expDate = document.getElementById('batchExp').value;

        if (name && id && qty && expDate) {
            inventory.push({ id: id, name: name, qty: qty, expDate: expDate });
            
            // Clear inputs
            document.getElementById('batchName').value = '';
            document.getElementById('batchId').value = '';
            document.getElementById('batchQty').value = '';
            
            renderInventory();
        } else {
            alert("Please complete all tracking metrics before saving.");
        }
    }

    function useBatch(index) {
        inventory.splice(index, 1);
        renderInventory();
    }

    // Initialize application interface
    window.onload = renderInventory;
</script>
</body>
</html>
